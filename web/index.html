<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evilginx Research Control Panel</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }

    main {
      padding: 24px;
      max-width: 1000px;
      margin: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .value {
      font-size: 32px;
      font-weight: 700;
      color: #38bdf8;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
    }

    button {
      background: #2563eb;
      border: 0;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    .error {
      color: #f87171;
      margin-bottom: 12px;
    }

    pre {
      background: #020617;
      padding: 14px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="login-view">
    <main>
      <div class="card" style="max-width: 420px; margin: 60px auto;">
        <h2 id="auth-title">Sign in</h2>
        <div id="auth-error" class="error"></div>

        <label>Username</label>
        <input id="username" autocomplete="username">

        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password">

        <div id="confirm-password-field" style="display: none;">
          <label>Confirm password</label>
          <input id="confirm-password" type="password" autocomplete="new-password">
        </div>

        <button id="auth-button" onclick="submitAuth()">Sign in</button>
      </div>
    </main>
  </div>

  <div id="dashboard-view" style="display: none;">
    <header>
      <strong>Evilginx Research Control Panel</strong>
      <button onclick="logout()">Log out</button>
    </header>

    <main>
      <div class="card">
        Signed in as <strong id="current-username"></strong> —
        role: <strong id="current-role"></strong>
      </div>

      <div class="grid">
        <div class="card">
          <div>Research events</div>
          <div class="value" id="research-events">0</div>
        </div>

        <div class="card">
          <div>Authentication tests</div>
          <div class="value" id="authentication-tests">0</div>
        </div>

        <div class="card">
          <div>Controls triggered</div>
          <div class="value" id="controls-triggered">0</div>
        </div>
      </div>

      <div class="card">
        <h2>Record authorized research outcome</h2>

        <label>Campaign ID</label>
        <input id="campaign-id" placeholder="lab-passkey-vs-otp">

        <label>Control tested</label>
        <select id="control-tested">
          <option value="email_gateway">Email gateway</option>
          <option value="conditional_access">Conditional access</option>
          <option value="passkey">Passkey / FIDO2</option>
          <option value="user_reporting">User reporting</option>
        </select>

        <label>Outcome</label>
        <select id="outcome">
          <option value="blocked">Blocked</option>
          <option value="detected">Detected</option>
          <option value="not_detected">Not detected</option>
        </select>

        <button onclick="recordOutcome()">Record outcome</button>
        <pre id="result"></pre>
      </div>
    </main>
  </div>

  <script>
    let csrfToken = "";
    let setupMode = false;

    async function apiRequest(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": csrfToken,
          ...(options.headers || {})
        },
        credentials: "same-origin"
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "request_failed");
      }

      return data;
    }

    async function loadAuthStatus() {
      const status = await apiRequest("/api/auth/status");
      setupMode = status.setup_required;

      document.getElementById("auth-title").textContent = setupMode
        ? "Create administrator"
        : "Sign in";

      document.getElementById("auth-button").textContent = setupMode
        ? "Create administrator"
        : "Sign in";

      document.getElementById("confirm-password-field").style.display = setupMode
        ? "block"
        : "none";
    }

    async function submitAuth() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      document.getElementById("auth-error").textContent = "";

      try {
        if (setupMode) {
          await apiRequest("/api/auth/register", {
            method: "POST",
            body: JSON.stringify({
              username,
              password,
              confirm_password: confirmPassword
            })
          });

          setupMode = false;
          document.getElementById("auth-title").textContent = "Sign in";
          document.getElementById("auth-button").textContent = "Sign in";
          document.getElementById("confirm-password-field").style.display = "none";
          return;
        }

        await apiRequest("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username, password })
        });

        await loadDashboard();
      } catch (error) {
        document.getElementById("auth-error").textContent =
          error.message.replaceAll("_", " ");
      }
    }

    async function loadDashboard() {
      const user = await apiRequest("/api/auth/me");
      const metrics = await apiRequest("/api/metrics");

      csrfToken = getCookie("panel_csrf");

      document.getElementById("login-view").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";

      document.getElementById("current-username").textContent = user.username;
      document.getElementById("current-role").textContent = user.role;

      document.getElementById("research-events").textContent =
        metrics.research_events;

      document.getElementById("authentication-tests").textContent =
        metrics.authentication_tests;

      document.getElementById("controls-triggered").textContent =
        metrics.controls_triggered;
    }

    async function recordOutcome() {
      try {
        const result = await apiRequest("/api/metrics/research-event", {
          method: "POST",
          body: JSON.stringify({
            campaign_id: document.getElementById("campaign-id").value,
            control_tested: document.getElementById("control-tested").value,
            outcome: document.getElementById("outcome").value
          })
        });

        document.getElementById("result").textContent =
          JSON.stringify(result, null, 2);

        await loadDashboard();
      } catch (error) {
        document.getElementById("result").textContent = error.message;
      }
    }

    async function logout() {
      await apiRequest("/api/auth/logout", { method: "POST" });

      csrfToken = "";

      document.getElementById("dashboard-view").style.display = "none";
      document.getElementById("login-view").style.display = "block";

      await loadAuthStatus();
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
      return match ? decodeURIComponent(match[2]) : "";
    }

    loadAuthStatus();
  </script>
</body>
</html>
